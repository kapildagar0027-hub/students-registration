
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Student Registration</h1>
    <p class="subtitle">Please fill in your details below</p>

    <form>

        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name" required>

        <label>Roll Number</label>
        <input type="text" placeholder="Enter your roll number" required>

        <label>Email Address</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Mobile Number</label>
        <input type="tel" placeholder="Enter your mobile number" required>

        <label>Date of Birth</label>
        <input type="date" required>

        <label>Gender</label>
        <select required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Course</label>
        <select required>
            <option value="">Select Course</option>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>BBA</option>
            <option>B.Sc</option>
            <option>MCA</option>
        </select>

        <label>Address</label>
        <textarea placeholder="Enter your address" rows="3" required></textarea>

        <button type="submit">Register Now</button>

        <p class="footer">© 2026 Student Registration Website</p>

    </form>

</div>

</body>
</html>
